aid: masteryconnect
name: MasteryConnect
description: 'MasteryConnect is a K-12 formative assessment and standards-mastery
  platform, now part of Instructure. It helps teachers and districts build
  standards-aligned assessments (from prebuilt items or custom content), deliver
  common and benchmark assessments, auto-score results, and turn the data into
  intuitive mastery reports that guide interventions. It integrates tightly with
  the Canvas LMS through single sign-on and real-time data synchronization.
  MasteryConnect was originally surfaced as a portfolio company of Trinity
  Ventures and added to the API Evangelist network; it was acquired by Instructure
  in 2019 and does not publish a standalone public developer API — integration is
  delivered through the Canvas LMS platform and its REST API.'
